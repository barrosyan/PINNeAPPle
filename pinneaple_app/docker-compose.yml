version: "3.9"

services:
  # ── FastAPI backend ───────────────────────────────────────────────────────
  backend:
    build:
      context: ..          # root of PINNeAPPle repo
      dockerfile: pinneaple_app/Dockerfile.backend
    container_name: pinneaple_backend
    restart: unless-stopped
    environment:
      - PYTHONUNBUFFERED=1
      - PYTHONPATH=/app/pinneaple_src
    volumes:
      # Mount checkpoints/outputs to persist between runs
      - pinneaple_checkpoints:/app/pinneaple_src/checkpoints
      - pinneaple_outputs:/app/pinneaple_src/outputs
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/health"]
      interval: 15s
      timeout: 5s
      retries: 5
    networks:
      - pinneaple_net

  # ── React frontend (nginx) ────────────────────────────────────────────────
  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    container_name: pinneaple_frontend
    restart: unless-stopped
    ports:
      - "3000:80"
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - pinneaple_net

volumes:
  pinneaple_checkpoints:
  pinneaple_outputs:

networks:
  pinneaple_net:
    driver: bridge
