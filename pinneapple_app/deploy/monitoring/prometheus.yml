# Scrapes pinneapple_app's own /api/metrics (see backend/main.py) plus
# node-exporter if you run one alongside. No GPU/nvidia-dcgm target here
# unlike the root `biaml` repo's monitoring stack -- this app's backend
# doesn't itself report GPU metrics (yet); add a target for your own
# GPU-exporter if you deploy one.
global:
  scrape_interval: 15s

scrape_configs:
  - job_name: "pinneapple-backend"
    metrics_path: /api/metrics
    static_configs:
      - targets: ["pinneapple-backend:8000"]

  - job_name: "node-exporter"
    static_configs:
      - targets: ["node-exporter:9100"]
