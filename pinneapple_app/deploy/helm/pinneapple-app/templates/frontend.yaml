apiVersion: apps/v1
kind: Deployment
metadata:
  name: pinneapple-frontend
  namespace: {{ .Values.namespace }}
  labels: { app: pinneapple-frontend }
spec:
  replicas: {{ .Values.frontend.replicas }}
  selector:
    matchLabels: { app: pinneapple-frontend }
  template:
    metadata:
      labels: { app: pinneapple-frontend }
    spec:
      containers:
        - name: frontend
          image: "{{ .Values.frontend.image.repository }}:{{ .Values.frontend.image.tag }}"
          ports:
            - containerPort: 80
          resources:
            {{- toYaml .Values.frontend.resources | nindent 12 }}
---
apiVersion: v1
kind: Service
metadata:
  name: pinneapple-frontend
  namespace: {{ .Values.namespace }}
spec:
  selector: { app: pinneapple-frontend }
  ports:
    - port: 80
      targetPort: 80
