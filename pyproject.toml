[build-system]
requires = ["hatchling>=1.24.0"]
build-backend = "hatchling.build"

[project]
name = "pinneapple"
version = "0.5.0"
description = "PINNeAPPle: Physics-Informed Neural Networks platform — PDE problem design, PINN/operator/GNN models, UQ, digital twins, meta-learning, active learning, validation, and REST serving."
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
authors = [
  { name = "Yan Barros" }
]
keywords = [
  "physics-ai", "pinn", "pde", "scientific-ml", "geometry",
  "neural-operators", "surrogate-models", "digital-twin",
  "uncertainty-quantification", "meta-learning", "active-learning",
  "solid-mechanics", "cfd", "elasticity",
]
classifiers = [
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Scientific/Engineering",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
  "Topic :: Scientific/Engineering :: Physics",
  "Intended Audience :: Science/Research",
  "Development Status :: 4 - Beta",
]

dependencies = [
  "numpy>=1.24",
  "scipy>=1.10",
  "pandas>=2.0",
  "pyyaml>=6.0",
  "tqdm>=4.66",
  "typing-extensions>=4.8",
  "pydantic>=2.0",
  "matplotlib>=3.8",
  "torch>=2.2",
  "xarray",
  "zarr"
]

[project.optional-dependencies]
# Geometry backends
geom = [
  "trimesh>=4.0.0",
  "meshio>=5.3.0",
  "gmsh>=4.11",
]

# Mesh simplification
geom_simplify = [
  "fast-simplification>=0.1.0",
  "open3d>=0.18.0",
]

# CAD support
cad = [
  "cadquery>=2.4.0",
]

# Solver backends (FDM / FEM / LBM)
solvers = [
  "numba>=0.59",
]

# Real equation-of-state backend for pinneapple_systems.process_components
# (pipe networks, compressors, valves, ... -- anything using real_gas_eos.py)
process = [
  "CoolProp>=6.6",
]

# Astropy-backed unit-safe constants/coordinate transforms
# (pinneapple_physics.pde_environment.presets.astropy_bridge)
astro = [
  "astropy>=6.0",
]

# JAX-CFD differentiable CFD solver
# (pinneapple_simulation.numerical_solvers.jax_cfd_solver)
jax_cfd = [
  "jax-cfd>=0.2.0",
]

# FEniCS / DOLFINx (axisymmetric FEM, rotary couplings, etc.)
fenics = [
  "fenics-dolfinx>=0.7.0",
  "mpi4py>=3.1",
  "petsc4py>=3.20",
]

# MuJoCo physics simulation (google-deepmind/mujoco)
mujoco = [
  "mujoco>=3.0",
]

# MuJoCo MJX backend — JAX-based GPU/TPU parallel rollouts
mujoco_mjx = [
  "mujoco>=3.0",
  "jax[cuda12]>=0.4.25",
]

# Genesis AI multi-physics robotics simulation (Genesis-Embodied-AI/Genesis)
genesis = [
  "genesis-world>=0.2.0",
]

# Noether — Emmi AI neural surrogate framework (UPT, AB-UPT, Transolver)
noether = [
  "emmiai-noether>=2026.4.0",
]

# PINN factory (symbolics)
pinn = [
  "sympy>=1.12",
]

# Uncertainty Quantification
uq = [
  "scipy>=1.10",
]

# REST API server
serve = [
  "fastapi>=0.111",
  "uvicorn[standard]>=0.29",
]

# Model export
export = [
  "onnx>=1.16",
  "onnxruntime>=1.18",
]

# Model hub (push_to_hub/from_pretrained on the Hugging Face Hub)
hub = [
  "huggingface_hub>=0.24",
]

# LLM-assisted pipeline drafting (pinneapple_llm) -- bring your own API key
llm = [
  "anthropic>=0.34",
  "openai>=1.40",
]

# Pipeline orchestration (pinneapple_orchestration) -- without this,
# every flow/task in that package still runs as a plain Python function
# (see pinneapple_orchestration/_prefect_compat.py); this extra adds real
# retries, scheduling, and a UI on top.
orchestration = [
  "prefect>=2.19",
]

# Adaptive (Bayesian/TPE) hyperparameter search -- see
# pinneapple_neural.trainer.adaptive_sweep. A dependency-free random-search
# fallback is used automatically if this extra is not installed.
tuning = [
  "optuna>=3.6",
]

# Local fine-tuning of a local (Ollama-served) model on data logged via
# pinneapple_llm.conversation_store
finetune = [
  "peft>=0.12",
  "datasets>=2.20",
  "transformers>=4.44",
]

# Vision-language-model dataset curation --
# pinneapple_tools.dataset_quality.vlm_curation (run a VLM over a short
# clip of each sequence and filter on its label/confidence judgment).
vlm_curation = [
  "transformers>=4.45",
  "accelerate>=0.30",
]

# Digital twin (MQTT / Kafka / OPC-UA / Modbus streams)
digital_twin = [
  "paho-mqtt>=2.0",
  "kafka-python>=2.0",
  "asyncua>=1.1",
  "pymodbus>=3.6",
]

# Time-series / classical models
timeseries = [
  "statsmodels>=0.14",
  "pmdarima>=2.0",
  "scikit-learn>=1.4",
  "PyWavelets>=1.6",
]

# Synthetic data and symbolics
synth = [
  "sympy>=1.12",
  "trimesh>=4.0.0",
  "meshio>=5.3.0",
]

# NASA / Earthdata examples
earthdata = [
  "requests>=2.31",
  "earthaccess>=0.10.0",
]

# Research / paper fetching
research = [
  "requests>=2.31",
  "pdfminer.six>=20231228",
]

# Local embedding-based retrieval (semantic search over a real corpus --
# pinneapple_analysis.retrieval). A small, CPU-friendly sentence-embedding
# model (no paid API dependency); the corpus itself is real repository
# content, never a fabricated index. See that module's own docstring for
# the honesty scope this stays within.
retrieval = [
  "sentence-transformers>=3.0",
]

# Everything (convenience install)
all = [
  "trimesh>=4.0.0",
  "meshio>=5.3.0",
  "gmsh>=4.11",
  "fast-simplification>=0.1.0",
  "cadquery>=2.4.0",
  "numba>=0.59",
  "sympy>=1.12",
  "fastapi>=0.111",
  "uvicorn[standard]>=0.29",
  "onnx>=1.16",
  "onnxruntime>=1.18",
  "paho-mqtt>=2.0",
  "kafka-python>=2.0",
  "sentence-transformers>=3.0",
  "statsmodels>=0.14",
  "requests>=2.31",
  "mujoco>=3.0",
  "genesis-world>=0.2.0",
  "emmiai-noether>=2026.4.0",
  "huggingface_hub>=0.24",
  "anthropic>=0.34",
  "openai>=1.40",
  "transformers>=4.45",
  "accelerate>=0.30",
]

# Visualisation (CFD-style plots, animations)
viz = [
  "matplotlib>=3.8",
  "scipy>=1.10",
]

# Interactive 3-D (optional, not required for basic viz)
viz_interactive = [
  "plotly>=5.18",
  "kaleido>=0.2",
]

# Dev tools
dev = [
  "ruff>=0.5",
  "pytest>=8.0",
  "pytest-cov>=4.1",
  "mypy>=1.8",
  "build>=1.2",
  "twine>=5.0",
  "ipykernel>=6.0",
  "httpx>=0.27",  # required by starlette.testclient.TestClient, used by tests/test_app_backend.py
  "jupyter>=1.0",
]

[project.urls]
Homepage = "https://github.com/barrosyan/PINNeAPPle"
Repository = "https://github.com/barrosyan/PINNeAPPle"
Issues = "https://github.com/barrosyan/PINNeAPPle/issues"

# NOTE: a `[project.scripts]` section previously declared `pdb`/`pinneapple`
# console entry points pointing at `pinneapple_pdb.cli:main`, but no
# `pinneapple_pdb/cli.py` (or any `main()`/argparse/click entry point)
# exists anywhere in `pinneapple_pdb/` -- confirmed by grepping the package
# and by a real `pip install` + running the installed console script, which
# fails with `ModuleNotFoundError: No module named 'pinneapple_pdb.cli'`.
# Removed rather than shipping a broken command; re-add once
# pinneapple_pdb/cli.py with a real main() exists.

[tool.hatch.build.targets.wheel]
packages = [
  # ── core ──────────────────────────────────────────────────────────────────
  "pinneapple",
  "pinneapple_data",
  "pinneapple_pdb",
  "pinneapple_problemdesign",

  # ── mega-modules ──────────────────────────────────────────────────────────
  # Each includes its nested sub-modules automatically.
  "pinneapple_physics",      # pde_environment + pinn_solver + symbolic_pde
  "pinneapple_neural",       # architectures + trainer + predictor
  "pinneapple_analysis",     # uncertainty + validation + inverse_problems
  "pinneapple_adaptation",   # transfer_learning + meta_learning
  "pinneapple_simulation",   # numerical_solvers + particle_dynamics + external_solvers
  "pinneapple_systems",      # time_series + cosimulation + digital_twin
  "pinneapple_design",       # geometry + design_optimizer
  "pinneapple_tools",        # visualization + model_export + hpo_experiments + benchmark_suite + compute_backends

  # ── extended packages ─────────────────────────────────────────────────────
  "pinneapple_worldmodel",
  "pinneapple_quantum",
  "pinneapple_registry",     # local artifact registry: models, datasets, experiments
  "pinneapple_orchestration", # optional Prefect-based pipeline layer (data gen, training, benchmark, publish, twin prep)
  "pinneapple_hub",          # push_to_hub/from_pretrained model hub
  "pinneapple_llm",          # LLM-assisted pipeline drafting + physics guardrail
  "pinneapple_blender",      # Blender export/render bridge
  "pinneapple_perception",   # extract physics from images/video/audio

  # ── arena + compatibility shims ───────────────────────────────────────────
  "pinneapple_arena",     # YAML/JSON-driven multi-model benchmark runner
  "pinneapple_models",    # shim → pinneapple_neural.architectures
  "pinneapple_train",     # shim → pinneapple_neural.trainer
  "pinneapple_solvers",   # shim → pinneapple_simulation.numerical_solvers
]
include = [
  "data/bundles/**/*",
]

# The wheel target's `packages` list already keeps the *wheel* limited to
# real importable code (verified: `unzip -l dist/*.whl` shows only the 24
# pinneapple*/ packages + dist-info, nothing else). Hatchling's *sdist*
# target has no such restriction by default -- without this section it
# falls back to "everything git-tracks", which on this monorepo pulls in
# tests/, examples/, docs/, notebooks/, benchmarks/, saas/, projects/,
# scripts/, templates/, package_map.json (703KB), presentation.html,
# learning_presentation.html, etc., bloating the sdist to ~20MB of content
# no installer needs. Restrict the sdist to the same package roots as the
# wheel, plus the essential metadata files.
[tool.hatch.build.targets.sdist]
include = [
  "pinneapple/**",
  "pinneapple_data/**",
  "pinneapple_pdb/**",
  "pinneapple_problemdesign/**",
  "pinneapple_physics/**",
  "pinneapple_neural/**",
  "pinneapple_analysis/**",
  "pinneapple_adaptation/**",
  "pinneapple_simulation/**",
  "pinneapple_systems/**",
  "pinneapple_design/**",
  "pinneapple_tools/**",
  "pinneapple_worldmodel/**",
  "pinneapple_quantum/**",
  "pinneapple_registry/**",
  "pinneapple_orchestration/**",
  "pinneapple_hub/**",
  "pinneapple_llm/**",
  "pinneapple_blender/**",
  "pinneapple_perception/**",
  "pinneapple_arena/**",
  "pinneapple_models/**",
  "pinneapple_train/**",
  "pinneapple_solvers/**",
  "LICENSE",
  "NOTICE",
  "README.md",
]
exclude = [
  "**/__pycache__",
  "**/*.pyc",
  "/tests",
  "/examples",
  "/docs",
  "/notebooks",
  "/benchmarks",
  "/saas",
  "/projects",
  "/scripts",
  "/templates",
  "/data",
  "/pinneapple_app",
  "/.github",
  "/.gitignore",
  "package_map.json",
  "presentation.html",
  "learning_presentation.html",
  "mkdocs.yml",
  "requirements-docs.txt",
  "scaffold_manifest.json",
  "pyproject.toml.example.extras",
  "run_all_examples.py",
  "pytest.ini",
]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.mypy]
python_version = "3.10"
ignore_missing_imports = true
warn_return_any = false
warn_unused_ignores = true
no_implicit_optional = true