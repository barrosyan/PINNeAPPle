[build-system]
requires = ["hatchling>=1.24.0"]
build-backend = "hatchling.build"

[project]
name = "pinneapple"
version = "0.4.0"
description = "PINNeAPPle: Physics-Informed Neural Networks platform — PDE problem design, PINN/operator/GNN models, UQ, digital twins, meta-learning, active learning, validation, and REST serving."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [
  { name = "Yan Barros" }
]
keywords = [
  "physics-ai", "pinn", "pde", "scientific-ml", "geometry",
  "neural-operators", "surrogate-models", "digital-twin",
  "uncertainty-quantification", "meta-learning", "active-learning",
  "solid-mechanics", "cfd", "elasticity",
]
classifiers = [
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "License :: OSI Approved :: MIT License",
  "Topic :: Scientific/Engineering",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
  "Topic :: Scientific/Engineering :: Physics",
  "Intended Audience :: Science/Research",
  "Development Status :: 4 - Beta",
]

dependencies = [
  "numpy>=1.24",
  "scipy>=1.10",
  "pandas>=2.0",
  "pyyaml>=6.0",
  "tqdm>=4.66",
  "typing-extensions>=4.8",
  "pydantic>=2.0",
  "matplotlib>=3.8",
  "torch>=2.2",
  "xarray",
  "zarr"
]

[project.optional-dependencies]
# Geometry backends
geom = [
  "trimesh>=4.0.0",
  "meshio>=5.3.0",
  "gmsh>=4.11",
]

# Mesh simplification
geom_simplify = [
  "fast-simplification>=0.1.0",
  "open3d>=0.18.0",
]

# CAD support
cad = [
  "cadquery>=2.4.0",
]

# Solver backends (FDM / FEM / LBM)
solvers = [
  "numba>=0.59",
]

# Real equation-of-state backend for pinneapple_systems.process_components
# (pipe networks, compressors, valves, ... -- anything using real_gas_eos.py)
process = [
  "CoolProp>=6.6",
]

# FEniCS / DOLFINx (axisymmetric FEM, rotary couplings, etc.)
fenics = [
  "fenics-dolfinx>=0.7.0",
  "mpi4py>=3.1",
  "petsc4py>=3.20",
]

# MuJoCo physics simulation (google-deepmind/mujoco)
mujoco = [
  "mujoco>=3.0",
]

# MuJoCo MJX backend — JAX-based GPU/TPU parallel rollouts
mujoco_mjx = [
  "mujoco>=3.0",
  "jax[cuda12]>=0.4.25",
]

# Genesis AI multi-physics robotics simulation (Genesis-Embodied-AI/Genesis)
genesis = [
  "genesis-world>=0.2.0",
]

# Noether — Emmi AI neural surrogate framework (UPT, AB-UPT, Transolver)
noether = [
  "emmiai-noether>=2026.4.0",
]

# PINN factory (symbolics)
pinn = [
  "sympy>=1.12",
]

# Uncertainty Quantification
uq = [
  "scipy>=1.10",
]

# REST API server
serve = [
  "fastapi>=0.111",
  "uvicorn[standard]>=0.29",
]

# Model export
export = [
  "onnx>=1.16",
  "onnxruntime>=1.18",
]

# Model hub (push_to_hub/from_pretrained on the Hugging Face Hub)
hub = [
  "huggingface_hub>=0.24",
]

# LLM-assisted pipeline drafting (pinneapple_llm) -- bring your own API key
llm = [
  "anthropic>=0.34",
  "openai>=1.40",
]

# Adaptive (Bayesian/TPE) hyperparameter search -- see
# pinneapple_neural.trainer.adaptive_sweep. A dependency-free random-search
# fallback is used automatically if this extra is not installed.
tuning = [
  "optuna>=3.6",
]

# Local fine-tuning of a local (Ollama-served) model on data logged via
# pinneapple_llm.conversation_store
finetune = [
  "peft>=0.12",
  "datasets>=2.20",
  "transformers>=4.44",
]

# Digital twin (MQTT / Kafka streams)
digital_twin = [
  "paho-mqtt>=2.0",
]

# Time-series / classical models
timeseries = [
  "statsmodels>=0.14",
  "pmdarima>=2.0",
  "scikit-learn>=1.4",
  "PyWavelets>=1.6",
]

# Synthetic data and symbolics
synth = [
  "sympy>=1.12",
  "trimesh>=4.0.0",
  "meshio>=5.3.0",
]

# NASA / Earthdata examples
earthdata = [
  "requests>=2.31",
  "earthaccess>=0.10.0",
]

# Research / paper fetching
research = [
  "requests>=2.31",
  "pdfminer.six>=20231228",
]

# Everything (convenience install)
all = [
  "trimesh>=4.0.0",
  "meshio>=5.3.0",
  "gmsh>=4.11",
  "fast-simplification>=0.1.0",
  "cadquery>=2.4.0",
  "numba>=0.59",
  "sympy>=1.12",
  "fastapi>=0.111",
  "uvicorn[standard]>=0.29",
  "onnx>=1.16",
  "onnxruntime>=1.18",
  "paho-mqtt>=2.0",
  "statsmodels>=0.14",
  "requests>=2.31",
  "mujoco>=3.0",
  "genesis-world>=0.2.0",
  "emmiai-noether>=2026.4.0",
  "huggingface_hub>=0.24",
  "anthropic>=0.34",
  "openai>=1.40",
]

# Visualisation (CFD-style plots, animations)
viz = [
  "matplotlib>=3.8",
  "scipy>=1.10",
]

# Interactive 3-D (optional, not required for basic viz)
viz_interactive = [
  "plotly>=5.18",
  "kaleido>=0.2",
]

# Dev tools
dev = [
  "ruff>=0.5",
  "pytest>=8.0",
  "pytest-cov>=4.1",
  "mypy>=1.8",
  "build>=1.2",
  "twine>=5.0",
  "ipykernel>=6.0",
  "httpx>=0.27",  # required by starlette.testclient.TestClient, used by tests/test_app_backend.py
  "jupyter>=1.0",
]

[project.urls]
Homepage = "https://github.com/barrosyan/PINNeAPPle"
Repository = "https://github.com/barrosyan/PINNeAPPle"
Issues = "https://github.com/barrosyan/PINNeAPPle/issues"
Changelog = "https://github.com/barrosyan/PINNeAPPle/blob/main/CHANGELOG.md"

[project.scripts]
pdb = "pinneapple_pdb.cli:main"
pinneapple = "pinneapple_pdb.cli:main"

[tool.hatch.build.targets.wheel]
packages = [
  # ── core ──────────────────────────────────────────────────────────────────
  "pinneapple",
  "pinneapple_data",
  "pinneapple_pdb",
  "pinneapple_problemdesign",

  # ── mega-modules ──────────────────────────────────────────────────────────
  # Each includes its nested sub-modules automatically.
  "pinneapple_physics",      # pde_environment + pinn_solver + symbolic_pde
  "pinneapple_neural",       # architectures + trainer + predictor
  "pinneapple_analysis",     # uncertainty + validation + inverse_problems
  "pinneapple_adaptation",   # transfer_learning + meta_learning
  "pinneapple_simulation",   # numerical_solvers + particle_dynamics + external_solvers
  "pinneapple_systems",      # time_series + cosimulation + digital_twin
  "pinneapple_design",       # geometry + design_optimizer
  "pinneapple_tools",        # visualization + model_export + hpo_experiments + benchmark_suite + compute_backends

  # ── extended packages ─────────────────────────────────────────────────────
  "pinneapple_worldmodel",
  "pinneapple_quantum",

  # ── arena + compatibility shims ───────────────────────────────────────────
  "pinneapple_arena",     # YAML/JSON-driven multi-model benchmark runner
  "pinneapple_models",    # shim → pinneapple_neural.architectures
  "pinneapple_train",     # shim → pinneapple_neural.trainer
  "pinneapple_solvers",   # shim → pinneapple_simulation.numerical_solvers
]
include = [
  "data/bundles/**/*",
]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.mypy]
python_version = "3.10"
ignore_missing_imports = true
warn_return_any = false
warn_unused_ignores = true
no_implicit_optional = true