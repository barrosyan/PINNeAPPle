# Helmholtz 2D — (Δ + k²) u = f on [0,1]^2
# Oscillatory solutions; SIREN well-suited for high-frequency modes
problem:
  name: helmholtz_2d
  params:
    k: 4.0
    n_collocation: 5000
    n_bc: 400

models:
  - name: SIREN-k4
    type: siren
    network:
      hidden: [64, 64, 64, 64]
      omega_0: 30.0
    training:
      epochs: 5000
      lr: 5.0e-4
      optimizer: adam

  - name: VanillaPINN-k4
    type: vanilla_pinn
    network:
      hidden: [128, 128, 128, 128]
      activation: tanh
    training:
      epochs: 5000
      lr: 1.0e-3
      optimizer: adam
      scheduler: cosine

  - name: ModifiedMLP-k4
    type: modified_mlp
    network:
      hidden: [128, 128, 128, 128]
      activation: tanh
    training:
      epochs: 5000
      lr: 1.0e-3
      optimizer: adam

output:
  dir: outputs/helmholtz_2d/
  prefix: helmholtz
  save_figures: true
  save_csv: true
