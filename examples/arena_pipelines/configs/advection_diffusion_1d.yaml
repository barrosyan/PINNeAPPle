# Advection-Diffusion 1D — u_t + v*u_x = D*u_xx on [0,2π] x [0,T]
# Periodic domain; benchmark for capturing traveling diffusing wave
problem:
  name: advection_diffusion_1d
  params:
    v: 1.0    # advection velocity
    D: 0.05   # diffusion coefficient
    n_collocation: 3000
    n_ic: 200
    n_bc: 200
    t_end: 2.0

models:
  - name: VanillaPINN
    type: vanilla_pinn
    network:
      hidden: [64, 64, 64, 64]
      activation: tanh
    training:
      epochs: 5000
      lr: 1.0e-3
      optimizer: adam
      scheduler: cosine

  - name: PINNsFormer
    type: pinnsformer
    network:
      d_model: 64
      nhead: 4
      num_layers: 3
      dim_feedforward: 256
    training:
      epochs: 3000
      lr: 5.0e-4
      optimizer: adam

  - name: SIREN
    type: siren
    network:
      hidden: [64, 64, 64, 64]
      omega_0: 30.0
    training:
      epochs: 5000
      lr: 5.0e-4
      optimizer: adam

output:
  dir: outputs/advection_diffusion_1d/
  prefix: adv_diff_1d
  save_figures: true
  save_csv: true
