# Burgers 1D — u_t + u*u_x = nu*u_xx on [-1,1] x [0,1]
# Nonlinear convection with shock formation; canonical PINN benchmark
problem:
  name: burgers_1d
  params:
    nu: 0.01   # viscosity (small → sharp shock)
    n_collocation: 10000
    n_ic: 200
    n_bc: 200
    t_end: 1.0

models:
  - name: VanillaPINN
    type: vanilla_pinn
    network:
      hidden: [20, 20, 20, 20, 20, 20, 20, 20]  # deep narrow (Raissi-style)
      activation: tanh
    training:
      epochs: 15000
      lr: 1.0e-3
      optimizer: adam
      scheduler: cosine

  - name: SIREN
    type: siren
    network:
      hidden: [128, 128, 128, 128]
      omega_0: 30.0
    training:
      epochs: 10000
      lr: 5.0e-4
      optimizer: adam

  - name: ModifiedMLP
    type: modified_mlp
    network:
      hidden: [128, 128, 128, 128]
      activation: tanh
    training:
      epochs: 10000
      lr: 1.0e-3
      optimizer: adam

output:
  dir: outputs/burgers_1d/
  prefix: burgers
  save_figures: true
  save_csv: true
