name: Tests (audit + core suite)

on:
  push:
    branches: ["main"]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install package + core test deps
        run: |
          python -m pip install --upgrade pip
          pip install -e .
          pip install pytest

      - name: Tier B — manufactured-solution physics-correctness tests (must pass)
        run: pytest tests/test_manufactured_solutions.py -q

      - name: Tier A — full-library breadth audit (informational; see AUDIT_REPORT.md)
        run: pytest tests/test_full_library_matrix.py -q --tb=line || true

      - name: Rest of the test suite
        run: pytest tests/ -q --ignore=tests/test_full_library_matrix.py --ignore=tests/test_manufactured_solutions.py || true
